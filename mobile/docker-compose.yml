services:
  agrosense-mobile-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrosense-mobile-web
    ports:
      - "8080:8080"
    command: flutter run -d web-server --web-port=8080 --web-hostname=0.0.0.0
    volumes:
      - .:/app
      - /app/.dart_tool

  agrosense-mobile-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrosense-mobile-test
    command: flutter test --reporter=expanded
    volumes:
      - .:/app
      - /app/.dart_tool
